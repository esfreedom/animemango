name: Scheduled jobs

# Runs the cron routes on the deployed site once an hour. Cloudflare Workers has no cron here,
# so GitHub Actions calls the routes. Set the repository variable SITE_URL (for example
# https://animemango.<account>.workers.dev) and the secret CRON_SECRET (same value as on the site).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the cron routes in order
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for path in /api/cron/sync /api/cron/drafts /api/cron/seo-audit; do
            curl --fail --silent --show-error --max-time 300 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL$path"
            echo
          done
